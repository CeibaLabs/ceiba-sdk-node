name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    # This is a published package whose package.json declares
    # `engines: { node: ">=20" }`. Testing only one version would leave that
    # claim unverified — a Node 20 regression could ship to consumers
    # unnoticed. The matrix tests the floor of the supported range and the
    # version production actually runs (the app images are node:22-alpine),
    # so the claim and the testing agree. If this matrix is ever narrowed,
    # narrow `engines` in the same change.
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package boundary smoke
        run: npm run smoke:package
