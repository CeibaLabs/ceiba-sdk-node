name: secret-scan

# Runs gitleaks on every push and PR so a leaked credential is caught before it
# lands, rather than found later by a point-in-time history scan. A scan of
# history at one moment says nothing about what the next commit introduces.
#
# THIS REPOSITORY IS PUBLIC, so a real leak here is exposed the moment it is
# pushed. This is the published package's source; anything committed here also ships to npm.
#
# Matches the workflow already running in ceiba-infra, ceiba-runtime and
# ceiba-control-plane - same image, same flags - so there is one procedure to
# reason about rather than four dialects of it.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans only this push/PR's commits: actions/checkout's default shallow
      # clone means gitleaks sees what is new rather than re-scanning the whole
      # history every run. The gitleaks CLI is MIT-licensed and free for any
      # repo visibility; only the maintained action wrapper needs a licence for
      # private repos, so this runs the CLI directly and needs no secret.
      - name: Scan for leaked secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --exit-code 1
